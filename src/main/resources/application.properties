spring.application.name=ecommerce-api

# Datasource (override with DB_URL / DB_USERNAME / DB_PASSWORD env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA - tables are created by db/schema.sql, Hibernate only validates them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
